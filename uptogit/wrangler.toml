# ---------------------------------------------------------------
# Cloudflare Pages + Functions configuration
# ---------------------------------------------------------------
# The actual Worker bundle lives in ./public/_worker.js which is
# generated by `npm run build`.  Cloudflare Pages automatically
# detects `_worker.js` inside the output directory and runs it in
# "advanced mode" (single file, no separate Functions folder), so
# every request - pages, assets and APIs - is handled by Hono.
# ---------------------------------------------------------------

name = "my-blog"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./public"

# ---------------------------------------------------------------
# D1 database binding - MUST be named DB
# Create it with:
#   npx wrangler d1 create blog-db
# then paste the returned database_id below.
# ---------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "00000000-0000-0000-0000-000000000000" # <-- replace me
migrations_dir = "migrations"

# ---------------------------------------------------------------
# R2 bucket binding - MUST be named BUCKET
# Create it with:
#   npx wrangler r2 bucket create blog-images
# ---------------------------------------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "blog-images"

# ---------------------------------------------------------------
# Plain-text variables (non-secret).
# Secrets (SITE_PASSWORD / ADMIN_PASS / COOKIE_SECRET) must NOT be
# committed here - use:
#   npx wrangler pages secret put SITE_PASSWORD --project-name my-blog
# For local development put them in .dev.vars (see .dev.vars.example)
# ---------------------------------------------------------------
[vars]
# Public base URL of the R2 bucket or a custom domain mapped to it.
R2_PUBLIC_URL = "https://images.example.com"
# Blog identity shown in the sidebar / <title>
BLOG_NAME = "suyiiyii's blog"
BLOG_DESCRIPTION = "记录折腾，热爱生活"
# Sidebar avatar (any absolute URL or a data: URI)
AVATAR_URL = "/static/avatar.svg"
# GitHub profile link shown in the sidebar
GITHUB_URL = "https://github.com/suyiiyii"
# Session lifetime in seconds (7 days)
SESSION_TTL = "604800"

# Preview deployments get their own D1/R2 bindings:
[[env.preview.d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "blog-images"
